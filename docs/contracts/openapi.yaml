    get:
      operationId: getStatsTeamWorkload
      summary: 团队工作量
      description: |
        批次 2 新增。按任务**负责人**（assignee_id）聚合：
        taskCount = 该负责人的任务数，doneCount = 其中已完成数，
        rate = 完成率（0–100 整数，四舍五入；taskCount 为 0 时为 0）。
        **只统计有负责人的任务**（SQL 是 JOIN app_user，无负责人不在结果里）；
        按任务数倒序。
        管理员可带 userId；普通用户服务端强制只看自己。
      tags: [统计]
