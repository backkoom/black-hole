        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenMustChange' }

  # ==========================================================================
  # 风险与问题（批次 2 新增）
  # ==========================================================================
  /api/risks:
    get:
      operationId: listRisks
      summary: 风险与问题列表
      description: |
        批次 2 新增。返回当前用户可见的全部风险与问题（不分页）。
        一张表用 kind 区分 risk（风险）/ issue（问题）；
        level 与 impact / probability 同为 low / medium / high；
        status 为 open（待处理）/ handling（处理中）/ resolved（已解决）。
        筛选可叠加：kind / level / status / projectId。
        管理员可带 userId；普通用户服务端强制只看自己创建的。
        默认按 created_at 倒序。
      tags: [风险]
      x-permission: 已登录；普通用户仅自己
      x-errors: [400, 401, 403]
      parameters:
        - name: kind
          in: query
          description: 只看风险或只看问题
          schema: { type: string, enum: [risk, issue] }
        - name: level
