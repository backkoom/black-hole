  /api/risks/summary:
    get:
      operationId: getRiskSummary
      summary: 风险与问题汇总统计
      description: |
        批次 2 新增。返回等级 / 状态 / 类型 / 影响×概率矩阵四组统计。
        - byLevel：各等级的数量与占比（percent 为 0–100 整数，总数为 0 时为 0）
        - byStatus：各处理状态的数量
        - byKind：risk 与 issue 的数量
        - matrix：键是 `impact:probability`，值是数量；**只统计 impact 与 probability
          都非空的记录**（两者任一为空则不进矩阵）
        管理员可带 userId；普通用户服务端强制只看自己创建的。
      tags: [风险]
      x-permission: 已登录；普通用户仅自己
      x-errors: [400, 401, 403]
      parameters:
        - name: userId
          in: query
          description: 仅管理员生效；普通用户忽略
          schema: { type: integer }
      responses:
        '200':
          description: 汇总统计
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { const: 0 }
                  message: { const: 'ok' }
                  data: { $ref: '#/components/schemas/RiskStats' }
              example:
                code: 0
                message: ok
                data:
                  total: 8
                  byLevel:
                    high: { count: 3, percent: 38 }
                    medium: { count: 4, percent: 50 }
                    low: { count: 1, percent: 13 }
                  byStatus: { open: 3, handling: 4, resolved: 1 }
                  byKind: { risk: 5, issue: 3 }
                  matrix:
                    high:high: 2
                    high:medium: 1
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenMustChange' }

