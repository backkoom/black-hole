              example: { code: 0, message: ok, data: null }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenOrigin' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/files/{id}/download:
    get:
      operationId: downloadFile
      summary: 下载文件
      description: |
        D-19 新增（2026-11-07）。流式返回二进制，**不走统一 JSON 包裹**
        （§6.1 的例外，与 CSV 模板导出同理）。

        - `Content-Disposition` 同时给 ASCII 兜底的 `filename` 与 RFC 5987 的
          `filename*=UTF-8''...`，中文名不乱码；
        - `hasFile=false` 的历史登记数据 → 404「该文件只有登记信息，没有可下载的实体」；
        - 数据库有记录但磁盘实体丢失 → 404「文件实体已丢失，请联系管理员从备份恢复」。
      tags: [文件]
      x-permission: 已登录；普通用户仅自己
      x-errors: [400, 401, 403, 404]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: 文件二进制流
          headers:
            Content-Disposition:
              description: 'attachment; filename="..."; filename*=UTF-8''...'
              schema: { type: string }
            X-Content-Type-Options:
              schema: { type: string, enum: [nosniff] }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenOrigin' }
        '404': { $ref: '#/components/responses/NotFound' }

