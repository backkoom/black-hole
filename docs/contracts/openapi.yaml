  /api/stats/trend:
    get:
      operationId: getStatsTrend
      summary: 任务完成趋势（按天）
      description: |
        批次 2 新增。返回最近 N 天的任务完成趋势。
        **按 created_at 落桶**（东八区日历日）：total = 当天创建的任务数，
        done = 其中已完成的数，pending = 其中未完成的数。
        days 取值 1 至 90，默认 7；服务端还会再 clamp 一次。
        返回的 days 数组固定 N 个点，**缺失的日子补 0**（不跳日）。
        管理员可带 userId；普通用户服务端强制只看自己。
      tags: [统计]
      x-permission: 已登录；普通用户仅自己
      x-errors: [400, 401, 403]
      parameters:
        - name: days
          in: query
          description: 统计天数，1 至 90，默认 7
          schema: { type: integer, minimum: 1, maximum: 90, default: 7 }
        - name: userId
          in: query
          description: 仅管理员生效；普通用户忽略
          schema: { type: integer }
      responses:
        '200':
          description: 趋势数据
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { const: 0 }
                  message: { const: 'ok' }
                  data: { $ref: '#/components/schemas/TrendResult' }
              example:
                code: 0
                message: ok
                data:
                  days:
                    - date: '2026-11-03'
                      label: 11/03
                      total: 4
                      done: 2
                      pending: 2
                    - date: '2026-11-04'
                      label: 11/04
                      total: 6
                      done: 5
                      pending: 1
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenMustChange' }

