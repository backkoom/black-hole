              schema:
                type: object
                properties:
                  code: { const: 0 }
                  message: { const: 'ok' }
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Risk' }
              example:
                code: 0
                message: ok
                data:
                  items:
                    - id: 12
                      projectId: 5
                      projectName: 设备巡检
                      code: R-001
                      kind: risk
                      title: 采集节点离线率偏高
                      description: 近三天离线率 3.2%
                      level: high
                      impact: high
                      probability: medium
                      status: handling
                      ownerId: 3
                      ownerName: 用户02
                      dueDate: '2026-11-20'
                      responsePlan: 增加备用链路
                      createdAt: '2026-11-01T09:00:00+08:00'
                      updatedAt: '2026-11-03T14:20:00+08:00'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenMustChange' }
    post:
      operationId: createRisk
      summary: 新增风险 / 问题
      description: |
        批次 2 新增。标题 1 至 256。
        kind 省略时默认 risk；level 省略时默认 medium；status 恒为 open（新建即待处理）。
        code 最长 32；description / responsePlan 最长 4000；
        dueDate 是**日历日**（YYYY-MM-DD）。
        归属当前登录用户；projectId / ownerId / impact / probability 等可空字段可传 null。
      tags: [风险]
      x-permission: 已登录
      x-errors: [400, 401, 403, 422]
      requestBody:
        required: true
        content:
