        - buckets：项目进度分桶，**顺序固定** 0-20% / 21-50% / 51-80% / 81-99% / 100%，
          没有项目的桶也返回 count=0（不跳桶）；0 任务的项目归入 0-20%
        - categories：任务分类分布，category 为空的归「未分类」，
          最多 12 类，按数量倒序
        管理员可带 userId；普通用户服务端强制只看自己。
