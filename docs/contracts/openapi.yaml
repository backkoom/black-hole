          schema: { type: integer }
      responses:
        '200':
          description: 分布数据
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { const: 0 }
                  message: { const: 'ok' }
                  data: { $ref: '#/components/schemas/DistributionResult' }
              example:
                code: 0
                message: ok
                data:
                  buckets:
                    - { label: 0-20%, count: 1 }
                    - { label: 21-50%, count: 2 }
                    - { label: 51-80%, count: 0 }
                    - { label: 81-99%, count: 1 }
                    - { label: 100%, count: 1 }
                  categories:
                    - { name: 产品需求, count: 8, done: 5 }
