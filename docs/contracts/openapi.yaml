          description: 修改成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { const: 0 }
                  message: { const: 'ok' }
                  data:
                    type: object
                    properties:
                      risk: { $ref: '#/components/schemas/Risk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenOrigin' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: 标题不合法
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: 422, message: 标题需 1 至 256 个字符 }
