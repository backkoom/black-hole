      responses:
        '200':
          description: 汇总统计
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { const: 0 }
                  message: { const: 'ok' }
                  data: { $ref: '#/components/schemas/FileStats' }
              example:
                code: 0
                message: ok
                data:
