  # ==========================================================================
  # 文件资料与文件夹（批次 2 新增；本期只登记元数据，不存二进制）
  # ==========================================================================
  /api/files:
    get:
      operationId: listFiles
      summary: 文件资料列表
      description: |
        批次 2 新增。返回当前用户可见的全部文件条目（不分页）。
        2026-11-07 起支持真实上传/下载（见 `/api/files/upload` 与 `/api/files/{id}/download`）。
        `hasFile=false` 表示只有登记信息、没有实体（历史数据）。
        kind：doc / sheet / slide / image / pdf / archive / other；
        version 是版本号字符串（如 v1.0），currentVersion 标记是否当前版本。
        筛选可叠加：folderId / kind / projectId。
        管理员可带 userId；普通用户服务端强制只看自己名下的。
        默认按 created_at 倒序。
      tags: [文件]
      x-permission: 已登录；普通用户仅自己
      x-errors: [400, 401, 403]
      parameters:
        - name: folderId
          in: query
          description: 所在文件夹
          schema: { type: integer, minimum: 1 }
        - name: kind
          in: query
          description: 文件类型
          schema: { type: string, enum: [doc, sheet, slide, image, pdf, archive, other] }
        - name: projectId
          in: query
          description: 所属项目
          schema: { type: integer, minimum: 1 }
        - name: userId
          in: query
          description: 仅管理员生效；普通用户忽略
          schema: { type: integer }
      responses:
        '200':
          description: 文件列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { const: 0 }
                  message: { const: 'ok' }
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/FileAsset' }
              example:
                code: 0
                message: ok
                data:
                  items:
                    - id: 30
                      projectId: 5
                      projectName: 设备巡检
                      folderId: 8
                      folderName: 巡检报告
                      name: 2026年11月巡检报告.pdf
                      kind: pdf
                      sizeBytes: 1048576
                      version: v1.0
                      currentVersion: true
                      ownerName: 用户02
                      createdAt: '2026-11-02T10:00:00+08:00'
                      updatedAt: '2026-11-02T10:00:00+08:00'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenMustChange' }
    post:
      operationId: createFile
      summary: 登记文件元数据
      description: |
        批次 2 新增。**只登记元数据，不上传二进制。**
        文件名 1 至 256；kind 省略时默认 other；version 省略时默认 v1.0；
        sizeBytes 省略时默认 0；新建的记录 currentVersion 恒为 true。
        归属当前登录用户。
      tags: [文件]
      x-permission: 已登录
      x-errors: [400, 401, 403, 422]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFileRequest'
            example:
              name: 2026年11月巡检报告.pdf
              kind: pdf
              sizeBytes: 1048576
              folderId: 8
              projectId: 5
              version: v1.0
      responses:
        '200':
          description: 登记成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { const: 0 }
                  message: { const: 'ok' }
                  data:
                    type: object
                    properties:
                      file: { $ref: '#/components/schemas/FileAsset' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenOrigin' }
        '422':
          description: 文件名不合法
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: 422, message: 文件名需 1 至 256 个字符 }

  /api/files/upload:
    post:
      operationId: uploadFile
      summary: 上传文件（multipart）
      description: |
        D-19 新增（2026-11-07）。`multipart/form-data`，文件字段名固定 `file`，
        可选字段 `folderId` / `projectId`（顺序无关，服务端按名字取）。

        - 落盘路径由服务端生成（`年/月/<uuid>.<ext>`），**不使用用户文件名做路径**；
        - `sizeBytes` 以实际写入字节数为准，不信任客户端声明；同时记录 sha256；
        - 单文件超过 `MAX_UPLOAD_MB`（默认 50MB）→ 413，且**不留下半截文件**；
        - `kind` 由 MIME + 扩展名自动归类。
      tags: [文件]
      x-permission: 已登录
      x-errors: [400, 401, 403, 413]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 要上传的文件
                folderId:
                  type: integer
                  minimum: 1
                  description: 归入的文件夹；不传 = 未分类
                projectId:
                  type: integer
                  minimum: 1
                  description: 关联项目；不传 = 不挂项目
      responses:
        '200':
          description: 上传成功，返回登记后的文件
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { const: 0 }
                  message: { const: 'ok' }
                  data:
                    type: object
                    properties:
                      file: { $ref: '#/components/schemas/FileAsset' }
              example:
                code: 0
                message: ok
                data:
                  file:
                    id: 31
                    projectId: null
                    projectName: null
                    folderId: null
                    folderName: null
                    name: 巡检报告.pdf
                    kind: pdf
                    sizeBytes: 1048576
                    version: v1.0
                    currentVersion: true
                    hasFile: true
                    mimeType: application/pdf
                    ownerName: 用户02
                    createdAt: '2026-11-07T18:30:00+08:00'
                    updatedAt: '2026-11-07T18:30:00+08:00'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenMustChange' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }

  /api/files/summary:
    get:
      operationId: getFileSummary
      summary: 文件资料汇总统计
