      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { const: 0 }
                  message: { const: 'ok' }
                  data: { type: 'null' }
              example: { code: 0, message: ok, data: null }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenOrigin' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ==========================================================================
  # 里程碑与会议（批次 2 新增）
  # ==========================================================================
  /api/milestones:
    get:
      operationId: listMilestones
      summary: 里程碑列表
      description: |
        批次 2 新增。返回当前用户可见的全部里程碑（不分页）。
        status 为 pending（未完成）/ done（已完成）。
        管理员可带 userId；普通用户服务端强制只看自己的。
        默认按 due_date 升序（null 排最后）、sort、id 排序。
      tags: [日程]
      x-permission: 已登录；普通用户仅自己
      x-errors: [400, 401, 403]
      parameters:
        - name: userId
          in: query
          description: 仅管理员生效；普通用户忽略
          schema: { type: integer }
      responses:
        '200':
          description: 里程碑列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { const: 0 }
                  message: { const: 'ok' }
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Milestone' }
              example:
                code: 0
                message: ok
                data:
                  items:
                    - id: 4
                      projectId: 5
                      projectName: 设备巡检
                      name: 完成首批节点部署
                      dueDate: '2026-11-15'
                      status: pending
                      sort: 0
                      createdAt: '2026-11-01T09:00:00+08:00'
                      updatedAt: '2026-11-01T09:00:00+08:00'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenMustChange' }
    post:
      operationId: createMilestone
      summary: 新建里程碑
      description: |
        批次 2 新增。名称 1 至 128。
        status 省略时默认 pending；dueDate 是**日历日**（YYYY-MM-DD），可空。
        归属当前登录用户。
      tags: [日程]
      x-permission: 已登录
      x-errors: [400, 401, 403, 422]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMilestoneRequest'
            example: { name: 完成首批节点部署, projectId: 5, dueDate: '2026-11-15' }
      responses:
        '200':
          description: 新建成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { const: 0 }
                  message: { const: 'ok' }
                  data:
                    type: object
                    properties:
                      milestone: { $ref: '#/components/schemas/Milestone' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenOrigin' }
        '422':
          description: 里程碑名称不合法
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: 422, message: 里程碑名称需 1 至 128 个字符 }

  /api/milestones/{id}:
    patch:
      operationId: updateMilestone
      summary: 修改里程碑
      description: |
        批次 2 新增。可改 name / dueDate / status（任意子集）。
        不传（undefined）的字段保持原值；dueDate 传 null 会清空。
        普通用户只能改自己的；他人或不存在一律 404（不泄露存在性）。
      tags: [日程]
      x-permission: 已登录；普通用户仅自己
      x-errors: [400, 401, 403, 404, 422]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMilestoneRequest'
            example: { status: done, dueDate: '2026-11-12' }
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { const: 0 }
                  message: { const: 'ok' }
                  data:
                    type: object
                    properties:
                      milestone: { $ref: '#/components/schemas/Milestone' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenOrigin' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: 里程碑名称不合法
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: 422, message: 里程碑名称需 1 至 128 个字符 }
    delete:
      operationId: deleteMilestone
      summary: 删除里程碑
      description: 批次 2 新增。**硬删**（里程碑是轻量记录，无历史追溯需求）。
      tags: [日程]
      x-permission: 已登录；普通用户仅自己
      x-errors: [400, 401, 403, 404]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { const: 0 }
                  message: { const: 'ok' }
                  data: { type: 'null' }
              example: { code: 0, message: ok, data: null }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenOrigin' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/meetings:
    get:
      operationId: listMeetings
      summary: 会议列表
      description: |
        批次 2 新增。返回当前用户可见的全部会议（不分页）。
        from / to 按 start_at 过滤（**闭区间**，含端点）；
        ⚠️ 传参必须是**带时区的完整 ISO 8601**（如 2026-11-04T09:00:00+08:00），
        只传 YYYY-MM-DD 会让 to 落在当天 00:00，当天后面的会议会被漏掉。
        管理员可带 userId；普通用户服务端强制只看自己的。
        默认按 start_at 升序。
      tags: [日程]
      x-permission: 已登录；普通用户仅自己
      x-errors: [400, 401, 403]
      parameters:
        - name: userId
          in: query
          description: 仅管理员生效；普通用户忽略
          schema: { type: integer }
        - name: from
          in: query
          description: 开始时间下界（含），带时区的 ISO 8601
          schema: { type: string }
        - name: to
          in: query
          description: 开始时间上界（含），带时区的 ISO 8601
          schema: { type: string }
      responses:
        '200':
          description: 会议列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { const: 0 }
                  message: { const: 'ok' }
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Meeting' }
              example:
                code: 0
                message: ok
                data:
                  items:
                    - id: 7
                      projectId: 5
                      projectName: 设备巡检
                      title: 11 月项目周会
                      location: 三号会议室
                      startAt: '2026-11-04T09:00:00+08:00'
                      endAt: '2026-11-04T10:00:00+08:00'
                      note: 汇报巡检进度
                      createdAt: '2026-11-03T09:00:00+08:00'
                      updatedAt: '2026-11-03T09:00:00+08:00'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenMustChange' }
    post:
      operationId: createMeeting
      summary: 新建会议
      description: |
        批次 2 新增。标题 1 至 128；startAt 必填。
        startAt / endAt 是**带时区的 ISO 8601**（如 2026-11-04T09:00:00+08:00）；
        endAt 可空（可传 null）；location 最长 128；note 最长 2000。
        归属当前登录用户。
      tags: [日程]
      x-permission: 已登录
      x-errors: [400, 401, 403, 422]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMeetingRequest'
            example:
              title: 11 月项目周会
              startAt: '2026-11-04T09:00:00+08:00'
              endAt: '2026-11-04T10:00:00+08:00'
              location: 三号会议室
              projectId: 5
      responses:
        '200':
          description: 新建成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { const: 0 }
                  message: { const: 'ok' }
                  data:
                    type: object
                    properties:
                      meeting: { $ref: '#/components/schemas/Meeting' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenOrigin' }
        '422':
          description: 标题不合法 / 开始时间为空
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: 422, message: 会议开始时间必填 }

  /api/meetings/{id}:
    delete:
      operationId: deleteMeeting
      summary: 删除会议
      description: 批次 2 新增。**硬删**（会议是轻量记录，无历史追溯需求）。
      tags: [日程]
      x-permission: 已登录；普通用户仅自己
      x-errors: [400, 401, 403, 404]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { const: 0 }
                  message: { const: 'ok' }
                  data: { type: 'null' }
              example: { code: 0, message: ok, data: null }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenOrigin' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sid
      description: HttpOnly 会话 Cookie。登录时下发；不使用 Bearer。

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      description: bigint 字符串。非法 id 返回 400，不查库。
      schema: { type: string, pattern: '^[0-9]+$' }
      example: '12'
    PageParam:
      name: page
      in: query
      description: 从 1 开始
      schema: { type: integer, minimum: 1, default: 1 }
    PageSizeParam:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    BadRequest:
      description: 参数缺失或类型错（zod 错误转成可读 message）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: 400, message: 请求参数不合法 }
    Unauthorized:
      description: 未登录或会话过期。前端跳登录。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: 401, message: 请先登录 }
    ForbiddenAdmin:
      description: |
        管理接口无权（用户、组织、模板）。本人改姓名例外。
        也可能是「必须先修改初始密码」——见 ForbiddenMustChange。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: 403, message: 没有权限 }
    ForbiddenOrigin:
      description: |
        Origin/Referer 不同源（非 GET 请求必查）。
        也可能是「必须先修改初始密码」——见 ForbiddenMustChange。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: 403, message: 没有权限 }
    ForbiddenMustChange:
      description: |
        必须先修改初始密码。onRequest 全局拦截：除 /api/auth/me、/api/auth/password、
        /api/auth/logout 外的**所有**接口（含 GET）在 must_change_password=true 时都返回 403。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: 403, message: 请先修改初始密码 }
    NotFound:
      description: 业务资源无权或不存在。任务、项目、灵感不泄露存在性。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: 404, message: 资源不存在 }
    PayloadTooLarge:
      description: 请求体或上传文件超过上限（JSON 2MB；导入单文件 2MB）。不返回堆栈。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: 413, message: 请求体超过大小限制 }
    Unprocessable:
      description: 业务校验失败（重复账号、最后超管、移动到自己子孙、布局不合法等）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: 422, message: 业务校验失败 }
    VersionConflict:
      description: |
        布局版本冲突。data 带服务端当前 version 与当前 items；
        前端弹「刷新」或「覆盖」两个选项，覆盖需二次确认。
      content:
        application/json:
          schema:
            type: object
            properties:
              code: { const: 409 }
              message: { type: string }
              data:
                type: object
                properties:
                  version: { type: integer }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/LayoutItem' }
          example:
            code: 409
            message: 布局已被他人修改，请选择刷新或覆盖
            data:
              version: 5
              items:
                - moduleKey: todo
                  w: 6
                  h: 4
                  config: {}
    ServerError:
      description: 服务器错误。不返回堆栈；记录 requestId。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: 500, message: 服务器内部错误 }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: '与 HTTP 状态码一致' }
        message: { type: string, description: '可直接展示给用户的中文文案' }
        data: { description: '可选的附加信息（如 409 的 version/items）' }

    Paged:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, items: {} }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    Role:
      type: string
      enum: [admin, user]

    UserStatus:
      type: string
      enum: [active, disabled]

    TaskStatus:
      type: string
      enum: [todo, doing, done]

    Priority:
      type: string
      enum: [low, medium, high]

    ProjectStatus:
      type: string
      enum: [active, done]

    OrgNode:
      type: object
      required: [id, parentId, level, name, sort, userCount, children]
      properties:
        id: { type: integer }
        parentId: { type: integer, nullable: true }
        level:
          type: integer
          minimum: 1
          maximum: 32
          description: '根为 1，每级 +1。**不设固定层级上限**：业务上限由服务端 MAX_ORG_LEVEL 控制（默认 32），客户可自行建到任意层级（D-07）'
        name: { type: string, maxLength: 64 }
        sort: { type: integer }
        userCount:
          type: integer
          description: 直接挂在该节点的用户数（含 disabled），不递归
        children:
          type: array
          items: { $ref: '#/components/schemas/OrgNode' }

    User:
      type: object
      required: [id, account, name, role, isSuper, orgId, org, mustChangePassword]
      properties:
        id: { type: integer }
        account: { type: string, description: '唯一登录名，创建后不可改；统一小写存储' }
        name: { type: string, maxLength: 64 }
        role: { $ref: '#/components/schemas/Role' }
        isSuper: { type: boolean, description: '仅种子决定，不可通过 API 设置' }
        orgId: { type: integer, description: '用户所挂的末级组织节点 id' }
        org:
          type: object
          required: [company, dept]
          properties:
            company: { type: string, description: '二级（公司）祖先名称' }
            dept: { type: string, description: '用户所挂末级节点名称（三级即部门，四级即科室）' }
        mustChangePassword: { type: boolean }

    UserListItem:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [status, lastLoginAt]
          properties:
            status: { $ref: '#/components/schemas/UserStatus' }
            lastLoginAt: { type: string, nullable: true, description: 'ISO 8601 带 +08:00' }

    LayoutItem:
      type: object
      required: [moduleKey, w, h, config]
      properties:
        moduleKey:
          type: string
          description: '12 个 active 模块之一；file/knowledge-list/ai 不可写入'
          examples: [todo, project-progress, quick-entry, calendar, data-chart, idea, text, notice, links, embed, gallery, divider]
        w: { type: integer, enum: [3, 4, 6, 12] }
        h: { type: integer, minimum: 2, maximum: 12 }
        config:
          type: object
          additionalProperties: true
          description: '按模块 schema 校验，≤ 64KB'

    Workspace:
      type: object
      required: [id, name, subtitle, version, items]
      properties:
        id: { type: integer }
        name: { type: string, maxLength: 128 }
        subtitle: { type: string, nullable: true, maxLength: 256 }
        version: { type: integer, description: '从 1 开始，每次布局保存 +1' }
        items:
          type: array
          description: 顺序即 sort；JSON 里不重复 sort 字段
          items: { $ref: '#/components/schemas/LayoutItem' }

    Task:
      type: object
      required:
        [
          id,
          userId,
          projectId,
          title,
          status,
          priority,
          projectName,
          dueDate,
          doneAt,
          createdAt,
          updatedAt,
          assigneeId,
          assigneeName,
          category,
          reminderAt,
          parentId,
          subtaskCount,
          startAt,
        ]
      properties:
        id: { type: integer }
        userId: { type: integer }
        projectId: { type: integer, nullable: true }
        title: { type: string, minLength: 1, maxLength: 256 }
        status: { $ref: '#/components/schemas/TaskStatus' }
        priority: { $ref: '#/components/schemas/Priority' }
        projectName: { type: string, nullable: true, description: 'JOIN 计算，不落库' }
        dueDate: { type: string, nullable: true, format: date }
        doneAt: { type: string, nullable: true, description: 'ISO 8601 带 +08:00；status=done 必有' }
        createdAt: { type: string }
        updatedAt: { type: string }
        assigneeId:
          type: integer
          nullable: true
          description: '负责人用户 id；批次 2 新增。为空表示无负责人'
        assigneeName:
          type: string
          nullable: true
          description: '负责人姓名（JOIN 计算）；批次 2 新增'
        category:
          type: string
          nullable: true
          maxLength: 32
          description: '分类（产品需求 / 会议 / 开发…）；批次 2 新增'
        reminderAt:
          type: string
          nullable: true
          description: '提醒时间，ISO 8601 带时区；批次 2 新增'
        parentId:
          type: integer
          nullable: true
          description: '父任务 id；批次 2 新增。为空表示不是子任务'
        subtaskCount:
          type: integer
          description: '子任务数（parent_id 指向本任务的未删除任务数）；批次 2 新增'
        startAt:
          type: string
          nullable: true
          description: '日程开始时间，ISO 8601 带时区；批次 2 新增'

    Project:
      type: object
      required:
        [
          id,
          userId,
          name,
          owner,
          dueDate,
          totalItems,
          doneItems,
          progress,
          status,
          createdAt,
          updatedAt,
          icon,
          color,
          phase,
          members,
          memberCount,
        ]
      properties:
        id: { type: integer }
        userId: { type: integer }
        name: { type: string, minLength: 1, maxLength: 128 }
        owner: { type: string, nullable: true, maxLength: 64 }
        dueDate: { type: string, nullable: true, format: date }
        totalItems: { type: integer, description: '该项目下未删除任务数；实时算，不落库' }
        doneItems: { type: integer, description: '其中 status=done 的数量；实时算，不落库' }
        progress:
          type: integer
          description: 'Math.round(doneItems / totalItems * 100)；totalItems=0 时为 0'
        status: { $ref: '#/components/schemas/ProjectStatus' }
        createdAt: { type: string }
        updatedAt: { type: string }
        icon:
          type: string
          nullable: true
          maxLength: 16
          description: '图标标识（模块卡片配色用）；批次 2 新增'
        color:
          type: string
          nullable: true
          maxLength: 16
          description: '主题色；批次 2 新增'
        phase:
          type: string
          nullable: true
          maxLength: 64
          description: '当前阶段；批次 2 新增'
        members:
          type: array
          description: '成员姓名（project_member JOIN app_user，按姓名排序）；批次 2 新增。无成员时为空数组'
          items: { type: string }
        memberCount:
          type: integer
          description: '成员数（= members.length）；批次 2 新增'

    ProjectDetail:
      type: object
      required: [project, tasks]
      properties:
        project: { $ref: '#/components/schemas/Project' }
        tasks:
          type: array
          description: |
            该项目下的任务。⚠️ 当前实现只返回**基础字段**（id / userId / projectId /
            title / status / priority / projectName / dueDate / doneAt / createdAt / updatedAt），
            不含批次 2 的 assigneeId / assigneeName / category / reminderAt /
            parentId / subtaskCount / startAt —— 需要这些字段请用 GET /api/tasks。
          items: { $ref: '#/components/schemas/Task' }

    Idea:
      type: object
      required: [id, content, createdAt, updatedAt]
      properties:
        id: { type: integer }
        content: { type: string, minLength: 1, maxLength: 2000 }
        createdAt: { type: string }
        updatedAt: { type: string }

    Overview:
      type: object
      required: [todayTotal, todayDone, doingTotal, doingToday, weeklyDone, weeklyTotal, weeklyRate, projectCount]
      properties:
        todayTotal: { type: integer, description: 'due_date = 今天且未删除的任务数' }
        todayDone: { type: integer, description: '其中 status = done 的数量' }
        doingTotal: { type: integer, description: 'status = doing 且未删除（不含 todo）' }
        doingToday: { type: integer, description: 'doingTotal 中 due_date = 今天的数量' }
        weeklyDone: { type: integer, description: '本周应完成集合中 status=done 的数量' }
        weeklyTotal: { type: integer, description: '本周应完成集合总数' }
        weeklyRate:
          type: integer
          nullable: true
          description: '0–100 整数，四舍五入；分母为 0 时为 null（D-02）'
        projectCount: { type: integer, description: '活跃项目数（未删除且未完成）' }

    TaskStats:
      type: object
      required: [todo, doing, done]
      properties:
        todo: { type: integer }
        doing: { type: integer }
        done: { type: integer }

    ImportResult:
      type: object
      required: [success, skipped, failed, errors, initialPasswords]
      properties:
        success: { type: integer }
        skipped: { type: integer, description: '重复账号跳过的数量，不算 failed' }
        failed: { type: integer }
        errors:
          type: array
          items:
            type: object
            required: [row, message]
            properties:
              row: { type: integer, description: 'CSV 行号' }
              message: { type: string }
        initialPasswords:
          type: array
          description: '一次性返回；服务端不保存明文'
          items:
            type: object
            required: [account, password]
            properties:
              account: { type: string }
              password: { type: string }

    LoginRequest:
      type: object
      required: [account, password]
      properties:
        account: { type: string }
        password: { type: string }

    ChangePasswordRequest:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword: { type: string }
        newPassword:
          type: string
          minLength: 8
          maxLength: 64
          pattern: '^(?=.*[A-Za-z])(?=.*[0-9]).+$'
          description: '至少 8 位，含字母和数字'

    CreateUserRequest:
      type: object
      required: [account, name, orgId]
      properties:
        account:
          type: string
          minLength: 4
          maxLength: 64
          description: '统一小写存储；唯一。**本接口不限制字母开头**（批量导入才按 4-32 位字母开头逐行校验）'
        name: { type: string, minLength: 1, maxLength: 64, description: '去首尾空格' }
        orgId: { type: integer, description: '末级（无子节点）组织节点 id' }
        role:
          type: string
          enum: [user, admin]
          default: user
          description: '仅超级管理员可提交 admin；管理员只能提交 user'

    UpdateUserRequest:
      type: object
      description: |
        管理员可提交 name/orgId/status/role 的任意子集；
        本人只允许 { name }，带其他字段一律 403（D-01 严格校验）。
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        orgId: { type: integer }
        status: { $ref: '#/components/schemas/UserStatus' }
        role: { $ref: '#/components/schemas/Role' }

    WorkspaceLayoutRequest:
      type: object
      required: [version, items]
      properties:
        version: { type: integer, minimum: 1, description: '当前版本号；不匹配返回 409' }
        items:
          type: array
          maxItems: 14
          items: { $ref: '#/components/schemas/LayoutItem' }

    WorkspaceTemplateRequest:
      type: object
      required: [version, items]
      description: |
        保存工作台模板。name / subtitle 可选（改了会一并更新模板的名称与副标题）；
        version 与 items 语义同 WorkspaceLayoutRequest（CAS，冲突 409）。
      properties:
        name: { type: string, maxLength: 128 }
        subtitle: { type: string, maxLength: 256 }
        version: { type: integer, minimum: 1, description: '当前版本号；不匹配返回 409' }
        items:
          type: array
          maxItems: 14
          items: { $ref: '#/components/schemas/LayoutItem' }

    CreateTaskRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 256 }
        projectId:
          type: integer
          nullable: true
          description: '必须属于当前登录用户（任务归属人）；管理员也不能代建'
        priority: { $ref: '#/components/schemas/Priority', default: medium }
        dueDate: { type: string, nullable: true, format: date }
        assigneeId:
          type: integer
          nullable: true
          description: '负责人用户 id（批次 2 新增）'
        category:
          type: string
          nullable: true
          minLength: 1
          maxLength: 32
          description: '分类（批次 2 新增）'
        reminderAt:
          type: string
          nullable: true
          format: date-time
          description: '提醒时间，ISO 8601 带时区（批次 2 新增）'
        parentId:
          type: integer
          nullable: true
          description: '父任务 id（批次 2 新增）'
        startAt:
          type: string
          nullable: true
          format: date-time
          description: '日程开始时间，ISO 8601 带时区（批次 2 新增）'

    UpdateTaskRequest:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 256 }
        projectId: { type: integer, nullable: true }
        priority: { $ref: '#/components/schemas/Priority' }
        dueDate: { type: string, nullable: true, format: date }
        assigneeId:
          type: integer
          nullable: true
          description: '负责人用户 id；传 null 清空（批次 2 新增）'
        category:
          type: string
          nullable: true
          minLength: 1
          maxLength: 32
          description: '分类；传 null 清空（批次 2 新增）'
        reminderAt:
          type: string
          nullable: true
          format: date-time
          description: '提醒时间；传 null 清空（批次 2 新增）'
        parentId:
          type: integer
          nullable: true
          description: '父任务 id；传 null 清空（批次 2 新增）'
        startAt:
          type: string
          nullable: true
          format: date-time
          description: '日程开始时间；传 null 清空（批次 2 新增）'

    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        owner: { type: string, nullable: true, maxLength: 64 }
        dueDate: { type: string, nullable: true, format: date }
        icon:
          type: string
          nullable: true
          maxLength: 16
          description: '图标标识（批次 2 新增）'
        color:
          type: string
          nullable: true
          maxLength: 16
          description: '主题色（批次 2 新增）'
        phase:
          type: string
          nullable: true
          maxLength: 64
          description: '当前阶段（批次 2 新增）'

    UpdateProjectRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        owner: { type: string, nullable: true, maxLength: 64 }
        dueDate: { type: string, nullable: true, format: date }
        icon:
          type: string
          nullable: true
          maxLength: 16
          description: '图标标识；传 null 清空（批次 2 新增）'
        color:
          type: string
          nullable: true
          maxLength: 16
          description: '主题色；传 null 清空（批次 2 新增）'
        phase:
          type: string
          nullable: true
          maxLength: 64
          description: '当前阶段；传 null 清空（批次 2 新增）'

    # ==========================================================================
    # 批次 2 新增：统计聚合
    # ==========================================================================
    TrendPoint:
      type: object
      required: [date, label, total, done, pending]
      properties:
        date: { type: string, format: date, description: '东八区日历日 YYYY-MM-DD' }
        label: { type: string, description: '图表轴标签（MM/DD）' }
        total: { type: integer, description: '当天创建的任务数' }
        done: { type: integer, description: '其中已完成的数量' }
        pending: { type: integer, description: '其中未完成的数量（= total - done）' }

    TrendResult:
      type: object
      required: [days]
      properties:
        days:
          type: array
          description: '固定 days 个点，缺失的日子补 0'
          items: { $ref: '#/components/schemas/TrendPoint' }

    ProgressBucket:
      type: object
      required: [label, count]
      properties:
        label:
          type: string
          description: '进度区间标签'
          enum: ['0-20%', '21-50%', '51-80%', '81-99%', '100%']
        count: { type: integer, description: '落在该区间的项目数' }

    CategoryStat:
      type: object
      required: [name, count, done]
      properties:
        name: { type: string, description: '分类名；category 为空的记作「未分类」' }
        count: { type: integer, description: '该分类的任务数' }
        done: { type: integer, description: '其中已完成的数量' }

    TeamMemberWorkload:
      type: object
      required: [userId, name, taskCount, doneCount, rate]
      properties:
        userId: { type: integer, description: '负责人用户 id' }
        name: { type: string, description: '负责人姓名' }
        taskCount: { type: integer, description: '该负责人的任务数' }
        doneCount: { type: integer, description: '其中已完成的数量' }
        rate:
          type: integer
          description: '完成率 0–100 整数，四舍五入；taskCount=0 时为 0'

    DistributionResult:
      type: object
      required: [buckets, categories]
      properties:
        buckets:
          type: array
          description: '项目进度分桶，顺序固定 0-20% / 21-50% / 51-80% / 81-99% / 100%'
          items: { $ref: '#/components/schemas/ProgressBucket' }
        categories:
          type: array
          description: '任务分类分布，最多 12 类，按数量倒序'
          items: { $ref: '#/components/schemas/CategoryStat' }

    TeamWorkloadResult:
      type: object
      required: [members]
      properties:
        members:
          type: array
          description: '按负责人聚合；只含**有负责人**的任务，按任务数倒序'
          items: { $ref: '#/components/schemas/TeamMemberWorkload' }

    # ==========================================================================
    # 批次 2 新增：风险与问题
    # ==========================================================================
    RiskKind:
      type: string
      enum: [risk, issue]
      description: 'risk=风险；issue=问题'

    RiskLevel:
      type: string
      enum: [low, medium, high]
      description: '等级；level / impact / probability 共用同一套取值'

    RiskStatus:
      type: string
      enum: [open, handling, resolved]
      description: 'open=待处理；handling=处理中；resolved=已解决'

    Risk:
      type: object
      required:
        [
          id,
          projectId,
          projectName,
          code,
          kind,
          title,
          description,
          level,
          impact,
          probability,
          status,
          ownerId,
          ownerName,
          dueDate,
          responsePlan,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: integer }
        projectId: { type: integer, nullable: true }
        projectName: { type: string, nullable: true, description: 'JOIN 计算，不落库' }
        code: { type: string, nullable: true, maxLength: 32, description: '编号' }
        kind: { $ref: '#/components/schemas/RiskKind' }
        title: { type: string, minLength: 1, maxLength: 256 }
        description: { type: string, nullable: true, maxLength: 4000 }
        level: { $ref: '#/components/schemas/RiskLevel' }
        impact: { type: string, nullable: true, enum: [low, medium, high], description: '影响度' }
        probability:
          type: string
          nullable: true
          enum: [low, medium, high]
          description: '发生概率'
        status: { $ref: '#/components/schemas/RiskStatus' }
        ownerId: { type: integer, nullable: true, description: '责任人用户 id' }
        ownerName: { type: string, nullable: true, description: '责任人姓名（JOIN 计算）' }
        dueDate: { type: string, nullable: true, format: date }
        responsePlan: { type: string, nullable: true, maxLength: 4000, description: '应对措施' }
        createdAt: { type: string }
        updatedAt: { type: string }

    RiskStats:
      type: object
      required: [total, byLevel, byStatus, byKind, matrix]
      properties:
        total: { type: integer, description: '风险与问题总数' }
        byLevel:
          type: object
          required: [high, medium, low]
          description: '各等级的数量与占比（percent 为 0–100 整数，总数为 0 时为 0）'
          properties:
            high: { $ref: '#/components/schemas/RiskLevelStat' }
            medium: { $ref: '#/components/schemas/RiskLevelStat' }
            low: { $ref: '#/components/schemas/RiskLevelStat' }
        byStatus:
          type: object
          required: [open, handling, resolved]
          properties:
            open: { type: integer }
            handling: { type: integer }
            resolved: { type: integer }
        byKind:
          type: object
          required: [risk, issue]
          properties:
            risk: { type: integer }
            issue: { type: integer }
        matrix:
          type: object
          description: '影响×概率矩阵；键是 `impact:probability`（如 high:medium），值是数量。只统计 impact 与 probability 都非空的记录'
          additionalProperties: { type: integer }

    RiskLevelStat:
      type: object
      required: [count, percent]
      properties:
        count: { type: integer }
        percent: { type: integer, description: '0–100 整数，四舍五入；总数为 0 时为 0' }

    CreateRiskRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 256 }
        kind: { $ref: '#/components/schemas/RiskKind' }
        code: { type: string, nullable: true, maxLength: 32 }
        projectId: { type: integer, nullable: true }
        description: { type: string, nullable: true, maxLength: 4000 }
        level: { $ref: '#/components/schemas/RiskLevel' }
        impact: { type: string, nullable: true, enum: [low, medium, high] }
        probability: { type: string, nullable: true, enum: [low, medium, high] }
        ownerId: { type: integer, nullable: true }
        dueDate: { type: string, nullable: true, format: date }
        responsePlan: { type: string, nullable: true, maxLength: 4000 }

    UpdateRiskRequest:
      type: object
      description: 新建字段的任意子集，**额外允许改 status**。不传的字段保持原值。
      properties:
        title: { type: string, minLength: 1, maxLength: 256 }
        kind: { $ref: '#/components/schemas/RiskKind' }
        code: { type: string, nullable: true, maxLength: 32 }
        projectId: { type: integer, nullable: true }
        description: { type: string, nullable: true, maxLength: 4000 }
        level: { $ref: '#/components/schemas/RiskLevel' }
        impact: { type: string, nullable: true, enum: [low, medium, high] }
        probability: { type: string, nullable: true, enum: [low, medium, high] }
        ownerId: { type: integer, nullable: true }
        dueDate: { type: string, nullable: true, format: date }
        responsePlan: { type: string, nullable: true, maxLength: 4000 }
        status: { $ref: '#/components/schemas/RiskStatus' }

    # ==========================================================================
    # 批次 2 新增：文件资料与文件夹
    # ==========================================================================
    FileKind:
      type: string
      enum: [doc, sheet, slide, image, pdf, archive, other]

    FileAsset:
      type: object
      required:
        [
          id,
          projectId,
          projectName,
          folderId,
          folderName,
          name,
          kind,
          sizeBytes,
          version,
          currentVersion,
          hasFile,
          mimeType,
          ownerName,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: integer }
        projectId: { type: integer, nullable: true }
        projectName: { type: string, nullable: true, description: 'JOIN 计算，不落库' }
        folderId: { type: integer, nullable: true }
        folderName: { type: string, nullable: true, description: 'JOIN 计算，不落库' }
        name: { type: string, minLength: 1, maxLength: 256 }
        kind: { $ref: '#/components/schemas/FileKind' }
        sizeBytes: { type: integer, description: '字节数' }
        version: { type: string, maxLength: 16, description: '版本号字符串（如 v1.0）' }
        currentVersion: { type: boolean, description: '是否当前版本' }
        hasFile: { type: boolean, description: '是否有可下载的实体；历史登记数据为 false' }
        mimeType: { type: string, nullable: true, description: '上传时的内容类型，下载时原样回给浏览器' }
        ownerName: { type: string, nullable: true, description: '上传人姓名（JOIN 计算）' }
        createdAt: { type: string }
        updatedAt: { type: string }

    FileFolder:
      type: object
      required: [id, projectId, parentId, name, fileCount, createdAt, updatedAt]
      properties:
        id: { type: integer }
        projectId: { type: integer, nullable: true }
        parentId: { type: integer, nullable: true, description: '父文件夹 id；为空表示顶层' }
        name: { type: string, minLength: 1, maxLength: 128 }
        fileCount: { type: integer, description: '该文件夹下未删除的文件数' }
        createdAt: { type: string }
        updatedAt: { type: string }

    FileStats:
      type: object
      required: [totalCount, totalBytes, folderCount, byKind]
      properties:
        totalCount: { type: integer, description: '文件总数' }
        totalBytes: { type: integer, description: '已用存储（字节）' }
        folderCount: { type: integer, description: '文件夹数' }
        byKind:
          type: array
          description: '分类分布，按数量倒序'
          items:
            type: object
            required: [kind, count, bytes]
            properties:
              kind: { $ref: '#/components/schemas/FileKind' }
              count: { type: integer }
              bytes: { type: integer }

    CreateFileRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 256 }
        kind: { $ref: '#/components/schemas/FileKind' }
        sizeBytes: { type: integer, minimum: 0, description: '字节数；省略时为 0' }
        folderId: { type: integer, nullable: true }
        projectId: { type: integer, nullable: true }
        version: { type: string, maxLength: 16, description: '版本号；省略时为 v1.0' }

    CreateFolderRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        projectId: { type: integer, nullable: true }
        parentId: { type: integer, nullable: true, description: '父文件夹 id；为空表示顶层' }

    # ==========================================================================
    # 批次 2 新增：里程碑与会议
    # ==========================================================================
    MilestoneStatus:
      type: string
      enum: [pending, done]
      description: 'pending=未完成；done=已完成'

    Milestone:
      type: object
      required: [id, projectId, projectName, name, dueDate, status, sort, createdAt, updatedAt]
      properties:
        id: { type: integer }
        projectId: { type: integer, nullable: true }
        projectName: { type: string, nullable: true, description: 'JOIN 计算，不落库' }
        name: { type: string, minLength: 1, maxLength: 128 }
        dueDate: { type: string, nullable: true, format: date }
        status: { $ref: '#/components/schemas/MilestoneStatus' }
        sort: { type: integer, description: '同级排序号' }
        createdAt: { type: string }
        updatedAt: { type: string }

    Meeting:
      type: object
      required:
        [id, projectId, projectName, title, location, startAt, endAt, note, createdAt, updatedAt]
      properties:
        id: { type: integer }
        projectId: { type: integer, nullable: true }
        projectName: { type: string, nullable: true, description: 'JOIN 计算，不落库' }
        title: { type: string, minLength: 1, maxLength: 128 }
        location: { type: string, nullable: true, maxLength: 128 }
        startAt: { type: string, description: '开始时间，ISO 8601 带 +08:00' }
        endAt: { type: string, nullable: true, description: '结束时间，ISO 8601 带 +08:00' }
        note: { type: string, nullable: true, maxLength: 2000 }
        createdAt: { type: string }
        updatedAt: { type: string }

    CreateMilestoneRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        projectId: { type: integer, nullable: true }
        dueDate: { type: string, nullable: true, format: date }
        status: { $ref: '#/components/schemas/MilestoneStatus' }

    UpdateMilestoneRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        dueDate: { type: string, nullable: true, format: date }
        status: { $ref: '#/components/schemas/MilestoneStatus' }

    CreateMeetingRequest:
      type: object
      required: [title, startAt]
      properties:
        title: { type: string, minLength: 1, maxLength: 128 }
        startAt: { type: string, description: '开始时间，ISO 8601 带时区（如 2026-11-04T09:00:00+08:00）' }
        endAt: { type: string, nullable: true, description: '结束时间，ISO 8601 带时区' }
        location: { type: string, nullable: true, maxLength: 128 }
        projectId: { type: integer, nullable: true }
        note: { type: string, nullable: true, maxLength: 2000 }
