  # ==========================================================================
  /api/stats/overview:
    get:
      operationId: getStatsOverview
      summary: 工作台指标卡
      description: |
        管理员可带 userId；普通用户忽略 userId，只看自己。
        管理员**不传** userId 时统计全员（与任务列表同口径）。
        口径：
        - todayTotal：due_date = 今天且未删除的任务数；todayDone：其中 status=done 的数量
        - doingTotal：status = doing 且未删除（不含 todo）；doingToday：其中 due_date = 今天的数量
        - projectCount：活跃项目数（未删除且未完成）
        - weeklyRate：本周完成率，0–100 整数，四舍五入；分母为 0 时为 null（前端显示「—」）
          本周应完成集合：未删除，due_date <= 本周日，且（未完成 或 done_at >= 本周一）；
          分子是集合中 status=done 的数量，分母是集合总数
      tags: [统计]
      x-permission: 已登录；普通用户仅自己
      x-errors: [400, 401, 403]
      parameters:
        - name: userId
          in: query
          description: 仅管理员生效；普通用户忽略
          schema: { type: integer }
      responses:
        '200':
          description: 指标卡数据
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { const: 0 }
                  message: { const: 'ok' }
                  data: { $ref: '#/components/schemas/Overview' }
              example:
                code: 0
                message: ok
                data:
                  todayTotal: 12
                  todayDone: 5
                  doingTotal: 7
                  doingToday: 2
                  weeklyDone: 8
                  weeklyTotal: 14
                  weeklyRate: 57
                  projectCount: 3
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenMustChange' }

