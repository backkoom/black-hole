              kind: risk
              code: R-001
              projectId: 5
              level: high
              impact: high
              probability: medium
              ownerId: 3
              dueDate: '2026-11-20'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                type: object
