openapi: 3.1.0

info:
  title: 工作台与组织架构 API
  version: 2.1.0
  description: |
    「工作台 + 任务 + 项目 + 组织账号 + 模板 + 统计聚合 + 风险问题 + 文件资料 + 日程」的唯一接口契约。

    来源：《AI 开发执行包-工作台与组织架构》§6.4（34 个接口）、§6.2（共享类型）、§6.3（错误映射）。
    路径与方法与 §6.4 逐条一致，含 `/api` 前缀。

    覆盖范围（2026-11-05 逐条核对 `apps/api/src/**/routes.ts` 的路由注册表）：
    - 一期 §6.4 的 34 个操作（24 条路径）
    - 用户端批次 2/3 新增 23 个操作（16 条路径）：统计聚合、风险问题、文件资料、里程碑与会议
    - D-19 新增 2 个操作（2 条路径）：文件上传、文件下载
    - 合计 **59 个操作 / 42 条路径**，与代码注册表逐条一致

    统一约定（§6.1）：
    - 成功 HTTP 200，body `{ code: 0, message: "ok", data: ... }`
    - 失败 HTTP 4xx/5xx，body `{ code: <http code>, message: "可展示文案", data?: ... }`
    - 例外：`GET /api/users/import/template` 成功时直接返回 text/csv 文件流，不包统一 JSON
    - 认证使用 HttpOnly Cookie `sid`；不使用 Bearer
    - 日期 YYYY-MM-DD；时间戳 ISO 8601 带 +08:00
    - 所有非 GET 校验 Origin/Referer 同源，不通过 403
    - 所有 :id 用 bigint 字符串解析，非法 id 返回 400 且不查库
    - **必须改密（must_change_password=true）时，除 `/api/auth/me`、`/api/auth/password`、
      `/api/auth/logout` 外的所有接口（含 GET）统一返回 403「请先修改初始密码」**

    与原文的偏离（见 docs/contracts/decisions.md）：
    - D-01 `/api/users*` 的请求体使用严格校验（带禁止字段 → 403/422），其余接口仍默认剥离未知字段
    - D-07 组织层级**不设固定上限**（业务上限走服务端 `MAX_ORG_LEVEL`，默认 32）；人员挂在无子节点的末级节点上
    - D-02 `weeklyRate` 为 0–100 的整数（分母为 0 时为 null）
    - D-04 时间戳由连接层固定 `timezone=Asia/Shanghai` 后序列化为 +08:00
    - D-05 校验顺序：Origin(403) → 会话(401) → must_change(403)
    - D-06 413/400/404/500 等框架异常统一包装为 `{ code, message }`，不返回堆栈
  contact:
    name: 工作台与组织架构项目组

servers:
  - url: /
    description: 同源部署（开发期由 Vite 代理 /api → http://127.0.0.1:3000）

security:
  - cookieAuth: []

tags:
  - name: 认证
    description: 登录、退出、会话、改密
  - name: 组织
    description: 组织树查询与增删改移（仅管理员）
  - name: 账号
    description: 账号管理、批量导入（仅管理员）
  - name: 工作台
    description: 用户工作台与默认模板
  - name: 任务
    description: 任务 CRUD 与状态流转
  - name: 项目
    description: 项目 CRUD 与进度
  - name: 灵感
    description: 灵感记录
  - name: 统计
    description: 工作台指标卡与任务分布
  - name: 风险
    description: 风险与问题登记、流转与汇总
  - name: 文件
    description: 文件资料与文件夹（仅元数据，不含二进制）
  - name: 日程
    description: 里程碑与会议

paths:
  # ==========================================================================
  # 1-4 认证
  # ==========================================================================
  /api/auth/login:
    post:
      operationId: login
      summary: 登录
      description: |
        成功设置 HttpOnly Cookie `sid`，返回当前用户。
        失败统一提示「账号或密码错误」，不泄露账号是否存在。
        连续 5 次密码错误：locked_until = now() + 10 分钟；成功登录清零；
        锁定到期后 failed_attempts 归零。锁定期间返回 403。
        status != active 按账号或密码错误返回 401，不创建 session。
        新密码策略：8 至 64 位，至少一个字母和一个数字。
      tags: [认证]
      security: []
      x-permission: 公开
      x-errors: [400, 401, 403]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              normal:
                summary: 正常登录
                value: { account: 'admin', password: 'Admin-2026' }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { const: 0 }
                  message: { const: 'ok' }
                  data:
                    type: object
                    properties:
                      user: { $ref: '#/components/schemas/User' }
              example:
                code: 0
                message: ok
                data:
                  user:
                    id: 1
                    account: admin
                    name: 系统管理员
                    role: admin
                    isSuper: true
                    orgId: 3
                    org: { company: 示例研究院, dept: 示例部门 }
                    mustChangePassword: true
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: 账号或密码错误（不区分账号是否存在）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: 401, message: 账号或密码错误 }
        '403':
          description: 账号已锁定，请 10 分钟后再试
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: 403, message: 账号已锁定，请 10 分钟后再试 }

  /api/auth/logout:
    post:
      operationId: logout
      summary: 退出登录
      description: |
        删除当前 session 并清除 Cookie。需同源（Origin/Referer 校验）。
        **无会话也返回 200**（幂等），不返回 401。
      tags: [认证]
      x-permission: 公开（无会话也返回 200）
      x-errors: [403]
      responses:
        '200':
          description: 退出成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { const: 0 }
                  message: { const: 'ok' }
                  data: { type: 'null' }
              example: { code: 0, message: ok, data: null }
        '403': { $ref: '#/components/responses/ForbiddenOrigin' }

  /api/auth/me:
    get:
      operationId: me
      summary: 当前用户
      description: |
        返回当前用户，含公司与部门名称。
        必须改密（must_change_password=true）时也允许访问。
      tags: [认证]
      x-permission: 已登录
      x-errors: [401]
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { const: 0 }
                  message: { const: 'ok' }
                  data:
                    type: object
                    properties:
                      user: { $ref: '#/components/schemas/User' }
              example:
                code: 0
                message: ok
                data:
                  user:
                    id: 2
                    account: user01
                    name: 用户01
                    role: user
                    isSuper: false
                    orgId: 3
                    org: { company: 示例研究院, dept: 示例部门 }
                    mustChangePassword: false
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/password:
    put:
      operationId: changePassword
      summary: 修改密码
      description: |
        校验旧密码；成功后置 must_change_password = false，
        删除该用户其他 session、保留当前 session。
        新密码 8 至 64 位，至少一个字母和一个数字；新旧密码相同也拒绝。
        成功后返回刷新过的用户信息；查不到用户时 data 为 null。
      tags: [认证]
      x-permission: 已登录（含 must_change）
      x-errors: [400, 401, 403]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example: { oldPassword: 'Old-2026x', newPassword: 'New-2026y' }
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { const: 0 }
                  message: { const: 'ok' }
                  data:
                    oneOf:
                      - type: object
                        properties:
                          user: { $ref: '#/components/schemas/User' }
                      - type: 'null'
              example:
                code: 0
                message: ok
                data:
                  user:
                    id: 2
                    account: user01
                    name: 用户01
                    role: user
                    isSuper: false
                    orgId: 3
                    org: { company: 示例研究院, dept: 示例部门 }
                    mustChangePassword: false
        '400':
          description: 参数不合法 / 新密码不满足策略 / 新旧密码相同 / 旧密码错误
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: 400, message: 旧密码不正确 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenOrigin' }

  # ==========================================================================
  # 5-8 组织
  # ==========================================================================
  /api/org/tree:
    get:
      operationId: getOrgTree
      summary: 组织树
      description: |
        返回整棵组织树。根只有一个。
        OrgNode.userCount 只统计直接挂在该节点的用户（含 disabled），不递归。
      tags: [组织]
      x-permission: 管理员
      x-errors: [401, 403]
      responses:
        '200':
          description: 组织树
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { const: 0 }
                  message: { const: 'ok' }
                  data:
                    type: object
                    properties:
                      nodes:
                        type: array
                        items: { $ref: '#/components/schemas/OrgNode' }
              example:
                code: 0
                message: ok
                data:
                  nodes:
                    - id: 1
                      parentId: null
                      level: 1
                      name: 示例集团
                      sort: 0
                      userCount: 0
                      children:
                        - id: 2
                          parentId: 1
                          level: 2
                          name: 示例研究院
                          sort: 0
                          userCount: 0
                          children:
                            - id: 3
                              parentId: 2
                              level: 3
                              name: 示例部门
                              sort: 0
                              userCount: 8
                              children: []
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenAdmin' }

  /api/org:
    post:
      operationId: createOrg
      summary: 新增组织节点
      description: |
        level 由父节点推导（parent.level + 1），**不设固定层级上限**
        （业务上限由服务端 MAX_ORG_LEVEL 控制，默认 32；客户交付后可自行建到 6 级、10 级）。
        path = 父 path + id + /。同一 parent 下 name 唯一（重复 422）。
        sort 取同级 max+1（空同级为 0）。
        根节点只有一个：`parentId` 传 null（或不传）表示新增**根节点**，仅在组织树为空时允许
        （2026-11-06 放开，否则空库建不了第一个节点）；已有根再传 null 一律 422。
        新增子节点时，若父节点已挂人员，父节点必须先被清空人员——否则父节点不再是末级，422。
      tags: [组织]
      x-permission: 管理员
      x-errors: [400, 401, 403, 404, 422]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                parentId:
                  type: integer
                  nullable: true
                  description: '父节点 id；null 或不传 = 新增根节点（仅当组织树为空时允许）'
                name: { type: string, minLength: 1, maxLength: 64, description: '去首尾空格' }
            example: { parentId: 3, name: 信息科 }
      responses:
        '200':
          description: 新增成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { const: 0 }
                  message: { const: 'ok' }
                  data:
                    type: object
                    properties:
                      node: { $ref: '#/components/schemas/OrgNode' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenAdmin' }
        '404':
          description: 上级节点不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: 404, message: 上级节点不存在 }
        '422':
          description: 同级重名 / 超过 MAX_ORG_LEVEL（默认 32）/ 父节点下仍有人员
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: 422, message: 同一上级下已存在同名节点 }

  /api/org/{id}:
    put:
      operationId: updateOrg
      summary: 修改 / 移动组织节点
      description: |
        改名、移动、调整排序。
        移动：不能移动到自身或子孙下（422）；根节点不可移动；
        移动后在同一事务里更新整棵子树的 path 和 level；
        移动/新增后整棵子树的 level 不得超过服务端 MAX_ORG_LEVEL（默认 32，超过 422）；
        **有人员的节点必须是末级（无子节点）**，移动后若不再是无子节点则 422，
        要求先把人员移到新的末级节点。
        同一 parent 下 name 唯一（重复 422）。
      tags: [组织]
      x-permission: 管理员
      x-errors: [400, 401, 403, 404, 422]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 64 }
                parentId: { type: integer }
                sort: { type: integer, minimum: 0 }
            example: { name: 信息科 }
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { const: 0 }
                  message: { const: 'ok' }
                  data:
                    type: object
                    properties:
                      node: { $ref: '#/components/schemas/OrgNode' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenAdmin' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: 成环 / 超过 MAX_ORG_LEVEL（默认 32）/ 同级重名 / 有人员的节点不再是末级
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: 422, message: 不能移动到自己的子孙下 }
    delete:
      operationId: deleteOrg
      summary: 删除组织节点
      description: 有子节点或有人员时拒绝（422）；根节点不可删除（422）；空节点可删。
      tags: [组织]
      x-permission: 管理员
      x-errors: [400, 401, 403, 404, 422]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { const: 0 }
                  message: { const: 'ok' }
                  data: { type: 'null' }
              example: { code: 0, message: ok, data: null }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenAdmin' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: 根节点不可删除 / 有子节点 / 仍有人员
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: 422, message: 该节点下仍有子节点，不能删除 }

  # ==========================================================================
  # 9-14 账号
  # ==========================================================================
  /api/users:
    get:
      operationId: listUsers
      summary: 账号列表
      description: |
        管理员可看全员。默认按 created_at desc。
        keyword 1 至 64，大小写不敏感，匹配 account 或 name 的子串；空字符串按未传处理。
      tags: [账号]
      x-permission: 管理员
      x-errors: [400, 401, 403]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: keyword
          in: query
          schema: { type: string, minLength: 1, maxLength: 64 }
        - name: orgId
          in: query
          schema: { type: integer }
        - name: role
          in: query
          schema: { type: string, enum: [admin, user] }
        - name: status
          in: query
          schema: { type: string, enum: [active, disabled] }
        - name: userId
          in: query
          description: 仅管理员生效；指定只看某个账号
          schema: { type: integer }
      responses:
        '200':
          description: 账号列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { const: 0 }
                  message: { const: 'ok' }
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Paged'
                      - type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/UserListItem' }
              example:
                code: 0
                message: ok
                data:
                  items:
                    - id: 1
                      account: admin
                      name: 系统管理员
                      role: admin
                      isSuper: true
                      orgId: 3
                      org: { company: 示例研究院, dept: 示例部门 }
                      mustChangePassword: false
                      status: active
                      lastLoginAt: '2026-10-29T11:32:37+08:00'
                  total: 9
                  page: 1
                  pageSize: 20
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenAdmin' }
    post:
      operationId: createUser
      summary: 新增账号
      description: |
        初始密码只返回一次；must_change_password = true。
        同一事务创建 kind=user 的 workspace 并复制当前模板 4 条 layout。
        账号 4 至 64 位，统一小写存储，唯一（**本接口不校验字母开头/下划线规则**；
        批量导入 CSV 才按「4 至 32 位、字母开头、字母数字下划线」逐行校验）。
        姓名 1 至 64 字符，去首尾空格。
        role 仅超管可填 admin；管理员只能创建 user。
        orgId 必须是末级（无子节点）组织节点。
      tags: [账号]
      x-permission: 管理员；role=admin 仅超级管理员
      x-errors: [400, 401, 403, 422]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            example: { account: 'zhangsan', name: '张三', orgId: 3, role: 'user' }
      responses:
        '200':
          description: 新增成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { const: 0 }
                  message: { const: 'ok' }
                  data:
                    type: object
                    properties:
                      user: { $ref: '#/components/schemas/UserListItem' }
                      initialPassword: { type: string, description: '一次性返回，不落库' }
              example:
                code: 0
                message: ok
                data:
                  user:
                    id: 20
                    account: zhangsan
                    name: 张三
                    role: user
                    isSuper: false
                    orgId: 3
                    org: { company: 示例研究院, dept: 示例部门 }
                    mustChangePassword: true
                  initialPassword: a7Kx9Qm2Lp4R
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenAdmin' }
        '422':
          description: 账号重复 / orgId 不是末级节点
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: 422, message: 账号已存在 }

  /api/users/{id}:
    put:
      operationId: updateUser
      summary: 编辑账号
      description: |
        管理员可改普通用户；**本人仅允许 { name }，带 orgId/status/role 等其他字段一律 403**（D-01）。
        role 仅超管可改；管理员不能停用/重置其他管理员；
        不能停用自己；不能停用或降级最后一个 active 超管。
        管理员的编辑表单不显示角色控件，请求体不带 role。
      tags: [账号]
      x-permission: 管理员；本人仅 name
      x-errors: [400, 401, 403, 404, 422]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
            examples:
              byAdmin:
                summary: 管理员改部门
                value: { orgId: 4 }
              bySelf:
                summary: 本人仅改姓名
                value: { name: '张三（改）' }
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { const: 0 }
                  message: { const: 'ok' }
                  data:
                    type: object
                    properties:
                      user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 管理接口无权，或本人带了禁止字段
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: 403, message: 没有权限 }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: 不能停用自己 / 不能停用或降级最后一个超管 / orgId 不是末级节点
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: 422, message: 不能停用最后一个超级管理员 }

  /api/users/{id}/reset-password:
    post:
      operationId: resetUserPassword
      summary: 重置密码
      description: |
        管理员可重置普通用户；管理员账号仅超管可重置；超管账号不可重置（只能本人改密）。
        生成 12 位随机密码（必须满足 8 位以上、含字母和数字的策略），只返回一次，不落库。
        同时置 must_change_password = true、清空 failed_attempts / locked_until、删除该用户全部 session。
      tags: [账号]
      x-permission: 管理员；超管账号仅超级管理员
      x-errors: [400, 401, 403, 404]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: 重置成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { const: 0 }
                  message: { const: 'ok' }
                  data:
                    type: object
                    properties:
                      initialPassword: { type: string }
              example:
                code: 0
                message: ok
                data: { initialPassword: mT4kR8vZ1xQ }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenAdmin' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/users/import:
    post:
      operationId: importUsers
      summary: 批量导入账号
      description: |
        multipart/form-data，字段：file（UTF-8 CSV，允许 BOM）+ orgId。
        表头必须为「姓名,账号,角色」三列；最多 1000 数据行；空行跳过。
        角色只允许 user/admin；**管理员提交含 admin 行的文件整批 403，不导入任何行，
        不静默降级为 user**；超级管理员可以导入 admin。
        重复账号跳过（计入 skipped），不算 failed；其他错误行给行号与原因并继续处理后续行，
        有效行仍导入，不因单行错误回滚整批。
        字段内逗号用双引号包裹，不支持字段内换行；读取时先去除 BOM，不用 split(',') 切分。
        每个成功用户 must_change_password = true，并在同一事务创建 workspace 并复制模板。
        初始密码一次性返回，不落库。
      tags: [账号]
      x-permission: 管理员；导入 admin 角色仅超级管理员
      x-errors: [400, 401, 403, 413, 422]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, orgId]
              properties:
                file:
                  type: string
                  format: binary
                  description: 'CSV 文件，≤ 2MB'
                orgId:
                  type: integer
                  description: 整批人挂到该末级组织节点
      responses:
        '200':
          description: 导入结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { const: 0 }
                  message: { const: 'ok' }
                  data: { $ref: '#/components/schemas/ImportResult' }
              example:
                code: 0
                message: ok
                data:
                  success: 6
                  skipped: 1
                  failed: 1
                  errors:
                    - row: 4
                      message: 账号 zhaoliu 已存在
                    - row: 9
                      message: 账号格式不合法
                  initialPasswords:
                    - account: user08
                      password: p3Xk7mQ2wR9t
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 管理接口无权，或文件含 admin 角色而提交者不是超管
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: 403, message: 只有超级管理员才能导入管理员账号 }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422':
          description: 表头不匹配 / 超过 1000 行 / orgId 不是末级节点
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: 422, message: CSV 表头必须是 姓名,账号,角色 }

  /api/users/import/template:
    get:
      operationId: downloadImportTemplate
      summary: 下载导入模板
      description: |
        成功时直接返回 text/csv 文件流（Content-Disposition: attachment），
        不包统一 JSON；该接口失败仍返回统一 JSON 错误。
      tags: [账号]
      x-permission: 管理员
      x-errors: [401, 403]
      responses:
        '200':
          description: CSV 模板
          headers:
            Content-Disposition:
              schema: { type: string }
              example: 'attachment; filename="users-template.csv"'
          content:
            text/csv:
              schema: { type: string }
              example: |
                姓名,账号,角色
                用户01,user01,user
                用户02,user02,user
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenAdmin' }

  # ==========================================================================
  # 15-19 工作台
  # ==========================================================================
  /api/workspace/template:
    get:
      operationId: getWorkspaceTemplate
      summary: 读取工作台模板
      description: |
        返回 workspace 表里 kind='template' 的唯一一行（管理员）。
      tags: [工作台]
      x-permission: 管理员
      x-errors: [401, 403, 404]
      responses:
        '200':
          description: 模板
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { const: 0 }
                  message: { const: 'ok' }
                  data: { $ref: '#/components/schemas/Workspace' }
              example:
                code: 0
                message: ok
                data:
                  id: 1
                  name: 默认模板
                  subtitle: null
                  version: 1
                  items:
                    - moduleKey: todo
                      w: 6
                      h: 4
                      config: {}
                    - moduleKey: project-progress
                      w: 6
                      h: 4
                      config: {}
                    - moduleKey: quick-entry
                      w: 3
                      h: 4
                      config:
                        items:
                          - { label: 项目, url: /projects }
                          - { label: 任务, url: /tasks }
                          - { label: 灵感, url: /workspace }
                          - { label: 设置, url: /settings/profile }
                    - moduleKey: idea
                      w: 3
                      h: 4
                      config: {}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenAdmin' }
        '404':
          description: 模板不存在（未执行种子）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: 404, message: 模板不存在，请先执行种子 }
    put:
      operationId: updateWorkspaceTemplate
      summary: 保存工作台模板
      description: |
        带 version；服务端比对，不一致返回 409，data 里带当前 version 与当前 items。
        保存使用 CAS：`WHERE id = 模板 workspace id AND version = $2`，
        不要复用用户工作台的 id。
        items 顺序即 sort，服务端按数组下标写 0..n-1。
      tags: [工作台]
      x-permission: 管理员
      x-errors: [400, 401, 403, 404, 409, 422]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceTemplateRequest'
      responses:
        '200':
          description: 保存成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { const: 0 }
                  message: { const: 'ok' }
                  data: { $ref: '#/components/schemas/Workspace' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenAdmin' }
        '404':
          description: 模板不存在（未执行种子）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: 404, message: 模板不存在，请先执行种子 }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422':
          description: 布局不合法（模块不可用 / 重复 / divider 超限 / 总数超限 / config 不合规）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: 422, message: 模块不可用：file }

  /api/workspace:
    get:
      operationId: getWorkspace
      summary: 读取我的工作台
      description: |
        当前用户的工作台。没有则复制模板后返回（仅修复历史缺失；
        正常创建/导入用户时已建好）。
      tags: [工作台]
      x-permission: 已登录
      x-errors: [401, 403]
      responses:
        '200':
          description: 工作台
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { const: 0 }
                  message: { const: 'ok' }
                  data: { $ref: '#/components/schemas/Workspace' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenMustChange' }
    put:
      operationId: updateWorkspaceMeta
      summary: 修改工作台名称与副标题
      description: |
        名称 1 至 128，副标题 0 至 256，去首尾空格；空副标题存 null。
        **名称与副标题不参与 version，不触发 409。**
      tags: [工作台]
      x-permission: 已登录（仅自己的）
      x-errors: [400, 401, 403, 404, 422]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 128 }
                subtitle: { type: string, maxLength: 256 }
            example: { name: 我的工作台, subtitle: 一期 }
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { const: 0 }
                  message: { const: 'ok' }
                  data: { $ref: '#/components/schemas/Workspace' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenOrigin' }
        '404':
          description: 工作台不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: 404, message: 工作台不存在 }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/workspace/layout:
    put:
      operationId: updateWorkspaceLayout
      summary: 保存工作台布局
      description: |
        带 version；服务端比对，不一致返回 409，data 里带当前 version 与当前 items。
        前端两个选项：刷新（丢弃本地改动，加载服务端布局）/ 覆盖（以服务端当前 version 为基础
        再提交本地布局，必须二次确认，不能静默覆盖）。
        布局约束：version 必填；items 数组；moduleKey 只能是 12 个 active 模块；
        file/knowledge-list/ai 只出现在模块库，不可写入 layout；
        w ∈ {3,4,6,12} 且不小于该模块 minSize；h ∈ [2,12]；
        divider 只能 w=12、h=2；非 divider 不重复；divider ≤ 3；总数 ≤ 14；
        config 按模块 schema 且 ≤ 64KB。
      tags: [工作台]
      x-permission: 已登录（仅自己的）
      x-errors: [400, 401, 403, 404, 409, 413, 422]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceLayoutRequest'
            example:
              version: 3
              items:
                - moduleKey: todo
                  w: 6
                  h: 4
                  config: {}
                - moduleKey: project-progress
                  w: 6
                  h: 4
                  config: {}
      responses:
        '200':
          description: 保存成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { const: 0 }
                  message: { const: 'ok' }
                  data: { $ref: '#/components/schemas/Workspace' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenOrigin' }
        '404':
          description: 工作台不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: 404, message: 工作台不存在 }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ==========================================================================
  # 20-24 任务
  # ==========================================================================
  /api/tasks:
    get:
      operationId: listTasks
      summary: 任务列表
      description: |
        默认按 created_at desc；分页默认 20，pageSize 最大 100。
        due=today 指 due_date=今天；overdue 指 due_date<今天且 status<>done；
        week 指 due_date 在本周一至周日；三种筛选都排除已删除任务。
        keyword 1 至 64，大小写不敏感，匹配 title 子串，空字符串按未传。
        普通用户强制按 user_id = 当前用户过滤，忽略 userId 参数。
        列表响应带 projectName（JOIN 计算，不落库）；projectId 为空时为 null。
        priority / assigneeId / category / from / to 为批次 2 新增筛选：
        priority 按优先级精确匹配；assigneeId 按负责人 id 精确匹配；
        category 按分类精确匹配；from / to 对 due_date 做闭区间过滤（YYYY-MM-DD）。
      tags: [任务]
      x-permission: 已登录；普通用户仅自己
      x-errors: [400, 401, 403]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: keyword
          in: query
          schema: { type: string, minLength: 1, maxLength: 64 }
        - name: due
          in: query
          schema: { type: string, enum: [today, overdue, week] }
        - name: projectId
          in: query
          schema: { type: integer }
        - name: status
          in: query
          schema: { type: string, enum: [todo, doing, done] }
        - name: priority
          in: query
          description: 按优先级精确筛选（批次 2 新增）
          schema: { type: string, enum: [low, medium, high] }
        - name: assigneeId
          in: query
          description: 按负责人 id 精确筛选（批次 2 新增）
          schema: { type: integer, minimum: 1 }
        - name: category
          in: query
          description: 按分类精确筛选（批次 2 新增）
          schema: { type: string, minLength: 1, maxLength: 32 }
        - name: from
          in: query
          description: due_date 下界（含），YYYY-MM-DD（批次 2 新增）
          schema: { type: string, format: date }
        - name: to
          in: query
          description: due_date 上界（含），YYYY-MM-DD（批次 2 新增）
          schema: { type: string, format: date }
        - name: userId
          in: query
          description: 仅管理员生效；普通用户忽略
          schema: { type: integer }
      responses:
        '200':
          description: 任务列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { const: 0 }
                  message: { const: 'ok' }
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Paged'
                      - type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Task' }
              example:
                code: 0
                message: ok
                data:
                  items:
                    - id: 101
                      userId: 2
                      projectId: 5
                      title: 巡检 MES 采集节点
                      status: doing
                      priority: high
                      projectName: 设备巡检
                      dueDate: '2026-10-29'
                      doneAt: null
                      createdAt: '2026-10-29T09:12:00+08:00'
                      updatedAt: '2026-10-29T09:40:00+08:00'
                      assigneeId: 3
                      assigneeName: 用户02
                      category: 产品需求
                      reminderAt: null
                      parentId: null
                      subtaskCount: 0
                      startAt: null
                  total: 1
                  page: 1
                  pageSize: 20
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenMustChange' }
    post:
      operationId: createTask
      summary: 新建任务
      description: |
        标题 1 至 256。projectId 可空，非空时必须属于**任务归属人**（当前登录用户）。
        新建任务只能归属当前登录用户：**POST /api/tasks 没有 userId，管理员也不能代建**。
        priority 三值，默认 medium；dueDate 可空，YYYY-MM-DD；
        新建默认 status = todo。priority 默认 medium，status 默认 todo。
        dueDate 只用于筛选和逾期判断，不自动改状态。
        批次 2 新增可选字段：assigneeId（负责人）、category（分类，最长 32）、
        reminderAt（提醒时间，ISO 8601 带时区）、parentId（父任务 id）、startAt（开始时间）。
        assigneeId / category / reminderAt / parentId / startAt 均可传 null 清空。
      tags: [任务]
      x-permission: 已登录
      x-errors: [400, 401, 403, 422]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
            example:
              title: 巡检 MES 采集节点
              projectId: 5
              priority: high
              dueDate: '2026-10-30'
              assigneeId: 3
              category: 产品需求
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { const: 0 }
                  message: { const: 'ok' }
                  data:
                    type: object
                    properties:
                      task: { $ref: '#/components/schemas/Task' }
              example:
                code: 0
                message: ok
                data:
                  task:
                    id: 102
                    userId: 2
                    projectId: 5
                    title: 巡检 MES 采集节点
                    status: todo
                    priority: high
                    projectName: 设备巡检
                    dueDate: '2026-10-30'
                    doneAt: null
                    createdAt: '2026-10-29T11:40:00+08:00'
                    updatedAt: '2026-10-29T11:40:00+08:00'
                    assigneeId: 3
                    assigneeName: 用户02
                    category: 产品需求
                    reminderAt: null
                    parentId: null
                    subtaskCount: 0
                    startAt: null
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenOrigin' }
        '422':
          description: 标题不合法 / projectId 不属于当前用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: 422, message: 项目不存在或不属于你 }

  /api/tasks/{id}:
    put:
      operationId: updateTask
      summary: 修改任务
      description: |
        不在这里改 status。普通用户做归属校验，管理员可改全员；
        projectId 按**任务归属人**校验，不按当前操作人（管理员代改也一样）。
        任务标题 1 至 256；dueDate 可空，YYYY-MM-DD。
        批次 2 新增可选字段：assigneeId / category / reminderAt / parentId / startAt，
        均可传 null 清空；不传（undefined）则保持原值不变。
      tags: [任务]
      x-permission: 已登录；普通用户仅自己
      x-errors: [400, 401, 403, 404, 422]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
            example: { title: 巡检 MES 采集节点（改）, priority: low }
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { const: 0 }
                  message: { const: 'ok' }
                  data:
                    type: object
                    properties:
                      task: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenOrigin' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      operationId: deleteTask
      summary: 删除任务
      description: 软删。删除后列表、统计、项目进度都不再计入。
      tags: [任务]
      x-permission: 已登录；普通用户仅自己
      x-errors: [400, 401, 403, 404]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { const: 0 }
                  message: { const: 'ok' }
                  data: { type: 'null' }
              example: { code: 0, message: ok, data: null }
        '400': { $ref: '#/components/responses/BadRequest' }
