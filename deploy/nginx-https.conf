# 工作台与组织架构 —— 独立部署（项目自带 nginx）
# 由 deploy/nginx.conf.example 落地到 /etc/nginx/conf.d/blackhole.conf
# 2026-11-06：切 HTTPS（自签证书），80 一律 301 到 443。

# --- HTTP：只做跳转 ---
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 证书续期/校验用；没有 ACME 也留着不碍事
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS：主站 ---
server {
    # nginx 1.24 不支持 `http2 on;`（1.25.1 才有），用 listen 上的 http2 参数
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/blackhole.crt;
    ssl_certificate_key /etc/nginx/ssl/blackhole.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 自签证书先不上 HSTS：一旦带上，浏览器会记住"只走 https"，
    # 换正式证书前想退回 http 会很难受。正式证书到位后再打开。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "same-origin" always;

    # 静态资源与页面：4m 足够（CSV 导入单文件限 2MB，这里留一倍余量）
    # ⚠️ 文件上传走 /api/files/upload，上限由 MAX_UPLOAD_MB（默认 50）决定，
    #    所以 /api/ 的 location 里单独放大到 60m —— 否则 10MB 文件会被 nginx
    #    直接 413，根本到不了应用（2026-11-08 压测发现，实测 10MB 上传 23ms 被拒）
    client_max_body_size 4m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    root /data/blackhole/apps/web/dist;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        # 必须 ≥ MAX_UPLOAD_MB（默认 50），否则大文件在 nginx 就被拦下
        client_max_body_size 60m;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # 批量导入 500 人要连算 500 次 bcrypt（成本 10 约 20s、12 约 1 分钟），
        # 60s 会把这种长请求掐成 504。放宽到 300s。
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # index.html 不缓存，否则发版后用户手里还是旧壳
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
    }

    location ~* \.map$ {
        deny all;
    }
}
