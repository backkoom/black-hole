# Black Hole —— 独立部署 · **多实例（L1）版**
# 与 nginx-https.conf 的唯一区别：/api/ 反代到 upstream（两个 API 实例），
# 单实例挂掉时 nginx 自动切到另一个。配合 blackhole-api@.service 使用。
# 落地：cp deploy/nginx-https-lb.conf /etc/nginx/conf.d/blackhole.conf

# 两个 API 实例；端口要和 blackhole-api@3001 / @3002 对应
upstream blackhole_api {
    server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:3002 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# --- HTTP：只做跳转 ---
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 证书续期/校验用；没有 ACME 也留着不碍事
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS：主站 ---
server {
    # nginx 1.24 不支持 `http2 on;`（1.25.1 才有），用 listen 上的 http2 参数
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/blackhole.crt;
    ssl_certificate_key /etc/nginx/ssl/blackhole.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 自签证书先不上 HSTS：一旦带上，浏览器会记住"只走 https"，
    # 换正式证书前想退回 http 会很难受。正式证书到位后再打开。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "same-origin" always;

    client_max_body_size 4m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    root /data/blackhole/apps/web/dist;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass         http://blackhole_api;
        proxy_http_version 1.1;
        # 一个实例挂了就换下一个（连接失败/超时/5xx 都算）
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # index.html 不缓存，否则发版后用户手里还是旧壳
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
    }

    location ~* \.map$ {
        deny all;
    }
}
